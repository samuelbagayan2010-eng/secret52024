<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message For You ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .side-gif {
            position: absolute;
            width: 130px;
            height: auto;
            bottom: 20px;
            pointer-events: none;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.1));
            z-index: 10;
        }

        .side-gif.left {
            left: 20px;
            animation: floatLeft 3s ease-in-out infinite alternate;
        }

        .side-gif.right {
            right: 20px;
            animation: floatRight 3s ease-in-out infinite alternate;
        }

        @keyframes floatLeft {
            0% { transform: translateY(0px) rotate(-5deg); }
            100% { transform: translateY(-15px) rotate(5deg); }
        }

        @keyframes floatRight {
            0% { transform: translateY(0px) rotate(5deg); }
            100% { transform: translateY(-15px) rotate(-5deg); }
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.6s ease-in-out;
        }

        .hidden {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
            position: absolute;
        }

        .cartoon-img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border: 5px solid white;
            animation: bounceIn 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            60% {
                transform: scale(1.1);
                opacity: 1;
            }
            100% {
                transform: scale(1);
            }
        }

        .btn-continue {
            margin-top: 25px;
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            animation: pulse 2s infinite;
        }

        .btn-continue:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        .message-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 320px;
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s;
        }

        .message-card.show {
            transform: translateY(0);
            opacity: 1;
        }

        .message-text {
            font-size: 18px;
            color: #333;
            line-height: 1.6;
            margin: 0;
            font-weight: 600;
        }

        .message-text span {
            display: block;
            margin-top: 8px;
            color: #ff4757;
        }

        .heart {
            position: absolute;
            color: #ff4757;
            font-size: 20px;
            animation: floatUp 3s linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.6);
                opacity: 1;
            }
            100% {
                transform: translateY(-150px) scale(1.4);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .side-gif {
                width: 80px;
            }
        }
    </style>
</head>
<body>

    <img src="bubu-dudu-dudu.gif" alt="Cute Left GIF" class="side-gif left">
    <img src="kawai-goodnight.gif" alt="Cute Right GIF" class="side-gif right">

    <div class="container">
        <div id="scene1" class="screen">
            <img src="IMG_20260129_165548_378.jpg" alt="Cute Cartoon" class="cartoon-img">
            <button class="btn-continue" onclick="showSecondScene()">Tap to Continue ❤️</button>
        </div>

        <div id="scene2" class="screen hidden">
            <img src="IMG_20260129_165548_378.jpg" alt="Cute Cartoon" class="cartoon-img" style="animation: none; margin-bottom: 15px; width: 140px; height: 140px;">
            <div id="messageCard" class="message-card">
                <p class="message-text">
                    Do not forget to eat, to pray, and always take care! 
                    <span>I love you! ❤️</span>
                </p>
            </div>
        </div>
    </div>

    <script>
        function speakMessage() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();

                const textToSpeak = "Do not forget to eat, to pray, and always take care! I love you!";
                const utterance = new SpeechSynthesisUtterance(textToSpeak);

                let voices = window.speechSynthesis.getVoices();
                let selectedVoice = voices.find(voice => 
                    voice.name.includes('Google US English') || 
                    voice.name.includes('Samantha') || 
                    voice.name.includes('Victoria') || 
                    voice.name.includes('Female') ||
                    voice.lang.includes('en')
                );

                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                }

                utterance.pitch = 1.4;
                utterance.rate = 0.95;
                utterance.volume = 1.0;

                window.speechSynthesis.speak(utterance);
            }
        }

        function showSecondScene() {
            speakMessage();

            const scene1 = document.getElementById('scene1');
            scene1.classList.add('hidden');

            const scene2 = document.getElementById('scene2');
            scene2.classList.remove('hidden');

            setTimeout(() => {
                const messageCard = document.getElementById('messageCard');
                messageCard.classList.add('show');
                startFloatingHearts();
            }, 100);
        }

        function startFloatingHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                
                const randomX = Math.floor(Math.random() * 200) - 100;
                heart.style.left = `calc(50% + ${randomX}px)`;
                heart.style.bottom = '50px';
                
                document.getElementById('scene2').appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 3000);
            }, 400);
        }
    </script>
</body>
</html>
