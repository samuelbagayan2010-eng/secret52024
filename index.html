<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message For You ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .side-gif {
            position: absolute;
            width: 130px;
            height: auto;
            bottom: 20px;
            pointer-events: none;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.1));
            z-index: 10;
        }

        .side-gif.left {
            left: 20px;
            animation: floatLeft 3s ease-in-out infinite alternate;
        }

        .side-gif.right {
            right: 20px;
            animation: floatRight 3s ease-in-out infinite alternate;
        }

        @keyframes floatLeft {
            0% { transform: translateY(0px) rotate(-5deg); }
            100% { transform: translateY(-15px) rotate(5deg); }
        }

        @keyframes floatRight {
            0% { transform: translateY(0px) rotate(5deg); }
            100% { transform: translateY(-15px) rotate(-5deg); }
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.6s ease-in-out;
            width: 100%;
        }

        .hidden {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
            position: absolute;
        }

        .cartoon-img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border: 5px solid white;
            animation: bounceIn 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            60% {
                transform: scale(1.1);
                opacity: 1;
            }
            100% {
                transform: scale(1);
            }
        }

        .btn-continue, .btn-submit {
            margin-top: 25px;
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-continue {
            animation: pulse 2s infinite;
        }

        .btn-continue:hover, .btn-submit:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        .message-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 320px;
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s;
            box-sizing: border-box;
        }

        .message-card.show {
            transform: translateY(0);
            opacity: 1;
        }

        .message-text {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
            margin: 0 0 15px 0;
            font-weight: 600;
        }

        .message-text span {
            display: block;
            margin-top: 5px;
            color: #ff4757;
        }

        .reply-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .reply-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #fecfef;
            border-radius: 12px;
            font-size: 14px;
            resize: none;
            outline: none;
            box-sizing: border-box;
            font-family: inherit;
        }

        .reply-input:focus {
            border-color: #ff4757;
        }

        .btn-submit {
            margin-top: 5px;
            padding: 8px 20px;
            font-size: 15px;
        }

        .success-msg {
            color: #2ed573;
            font-weight: bold;
            font-size: 15px;
            margin-top: 10px;
            display: none;
        }

        .heart {
            position: absolute;
            color: #ff4757;
            font-size: 20px;
            animation: floatUp 3s linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.6);
                opacity: 1;
            }
            100% {
                transform: translateY(-150px) scale(1.4);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .side-gif {
                width: 80px;
            }
        }
    </style>
</head>
<body>

    <img src="bubu-dudu-dudu.gif" alt="Cute Left GIF" class="side-gif left">
    <img src="kawai-goodnight.gif" alt="Cute Right GIF" class="side-gif right">

    <div class="container">
        <!-- Scene 1 -->
        <div id="scene1" class="screen">
            <img src="IMG_20260129_165548_378.jpg" alt="Cute Cartoon" class="cartoon-img">
            <button class="btn-continue" onclick="showSecondScene()">Tap to Continue ❤️</button>
        </div>

        <!-- Scene 2 -->
        <div id="scene2" class="screen hidden">
            <img src="IMG_20260129_165548_378.jpg" alt="Cute Cartoon" class="cartoon-img" style="animation: none; margin-bottom: 12px; width: 110px; height: 110px;">
            <div id="messageCard" class="message-card">
                <p class="message-text">
                    Do not forget to eat, to pray, and always take care! 
                    <span>I love you! ❤️</span>
                </p>
                
                <!-- Email Form -->
                <form id="emailForm" class="reply-form" onsubmit="sendEmail(event)">
                    <!-- REPLACE THE VALUE BELOW WITH YOUR ACTUAL EMAIL ACCESS KEY -->
                    <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY_HERE">
                    <input type="hidden" name="subject" value="New secret message from your special page! 💌">
                    
                    <textarea name="message" class="reply-input" rows="3" placeholder="Send a message for me!" required></textarea>
                    <button type="submit" class="btn-submit">Send</button>
                </form>
                <div id="successMsg" class="success-msg">Message sent successfully!</div>
            </div>
        </div>
    </div>

<script>
        function speakMessage() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();

                const textToSpeak = "Do not forget to eat, to pray, and always take care!";
                const utterance = new SpeechSynthesisUtterance(textToSpeak);

                let voices = window.speechSynthesis.getVoices();
                let selectedVoice = voices.find(voice => 
                    voice.name.includes('David') || 
                    voice.name.includes('Mark') || 
                    voice.name.includes('George') || 
                    voice.name.includes('Male') ||
                    voice.name.includes('UK English Male')
                );

                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                }

                utterance.pitch = 1.8; 
                utterance.rate = 1.1;  
                utterance.volume = 1.0;

                window.speechSynthesis.speak(utterance);
            }
        }

        function showSecondScene() {
            speakMessage();

            const scene1 = document.getElementById('scene1');
            scene1.classList.add('hidden');

            const scene2 = document.getElementById('scene2');
            scene2.classList.remove('hidden');

            setTimeout(() => {
                const messageCard = document.getElementById('messageCard');
                messageCard.classList.add('show');
                startFloatingHearts();
            }, 100);
        }

        function sendEmail(event) {
            event.preventDefault();
            const form = document.getElementById('emailForm');
            const formData = new FormData(form);
            const submitBtn = form.querySelector('.btn-submit');
            
            submitBtn.textContent = 'Sending...';
            submitBtn.disabled = true;
s://
            fetch('https://formsubmit.co/ajax/samuelbagayan2010@gmail.com', {
                method: 'POST',
                body: formData
            })
            .then(async (response) => {
                let json = await response.json();
                if (response.status == 200) {
                    form.style.display = 'none';
                    document.getElementById('successMsg').style.display = 'block';
                } else {
                    alert(json.message);
                    submitBtn.textContent = 'Send';
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                console.log(error);
                alert("Something went wrong!");
                submitBtn.textContent = 'Send';
                submitBtn.disabled = false;
            });
        }

        function startFloatingHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                
                const randomX = Math.floor(Math.random() * 200) - 100;
                heart.style.left = `calc(50% + ${randomX}px)`;
                heart.style.bottom = '50px';
                
                document.getElementById('scene2').appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 3000);
            }, 400);
        }
    </script>
</body>
</html>
